<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inicio de sesión · Colección Micológica</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Open+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B4A}a:hover{color:#143F2C}
.topo-osc{background:#143F2C url(assets/topo-claro.svg) center/cover no-repeat}
.esporada{background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.22) 0 1deg,transparent 1deg 5deg)}
</style>
<style>
.volver-diseno{position:fixed;left:14px;bottom:14px;z-index:99;background:#143F2C;color:#fff;font:600 12px 'Open Sans',sans-serif;padding:8px 14px;border-radius:99px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.volver-diseno:hover{color:#FBB92A}</style>
</head>
<body>
<div style="min-height: 800px; display: flex; flex-wrap: wrap; font-family: 'Open Sans', system-ui, sans-serif; color: #1C2230; background: #F5F3EC;">
  <section class="topo-osc" style="flex: 1 1 520px; min-height: 420px; position: relative; overflow: hidden; color: #FFFFFF; padding: 40px 48px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;">
    <div class="esporada" style="position: absolute; right: -140px; bottom: -140px; width: 460px; height: 460px; border-radius: 50%; background-color: #1F6B4A;" aria-hidden="true"></div>
    <div style="position: absolute; right: 30px; bottom: 30px; width: 120px; height: 120px; border-radius: 50%; background: #143F2C;" aria-hidden="true"></div>
    <div style="display: flex; align-items: center; gap: 22px; position: relative;">
      <img src="assets/uned-blanco.png" alt="UNED" style="height: 30px;">
      <img src="assets/ecen-blanco.png" alt="Escuela de Ciencias Exactas y Naturales" style="height: 42px;">
      <img src="assets/citted-blanco.png" alt="CITTED" style="height: 40px;">
    </div>
    <div style="position: relative; max-width: 460px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .16em; color: #FBB92A; text-transform: uppercase;">Región Huetar Norte</span>
      <h1 style="margin: 10px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 76px; line-height: .95;">Colección<br><span style="font-style: italic;">Micológica</span></h1>
    </div>
    <span style="position: relative; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #CFE5D7;">CITTED · UNED</span>
  </section>

  <section style="flex: 1 1 420px; display: flex; align-items: center; justify-content: center; padding: 48px 32px; box-sizing: border-box;">
    <form style="width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 16px;">
      <h2 style="margin: 0 0 8px; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 38px; color: #143F2C;">Entrar</h2>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600;">Correo
        <input type="email" placeholder="nombre@uned.ac.cr" style="height: 48px; border: 1px solid #C6CEBF; border-radius: 12px; padding: 0 14px; font: inherit; font-weight: 400; font-size: 15px; background: #FFFFFF;">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600;">Contraseña
        <input type="password" value="12345678" style="height: 48px; border: 1px solid #C6CEBF; border-radius: 12px; padding: 0 14px; font: inherit; font-weight: 400; font-size: 15px; background: #FFFFFF;">
      </label>
      <a href="especimenes.html" style="height: 50px; border-radius: 12px; background: #1F6B4A; color: #FFFFFF; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; text-decoration: none; margin-top: 6px;">Iniciar sesión</a>
      <a href="#" style="font-size: 13px; text-align: center; min-height: 44px; display: flex; align-items: center; justify-content: center;">¿Olvidó su contraseña?</a>
    </form>
  </section>
</div>
<a class="volver-diseno" href="index.html">← Pantallas</a>
</body>
</html>
