<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Selección para estudiantes · Colección Micológica</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,500;0,600;0,700;1,600;1,700&amp;family=Merriweather:ital,wght@0,400;1,400;1,700&amp;family=Open+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#DCE3D6;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 0}
a{color:#0D3996}a:hover{color:#021135}
.topo-osc{background:#0D3996 url(assets/topo-claro.svg) center/cover no-repeat}
.foto{background:repeating-linear-gradient(135deg,#D3DCCB 0 2px,#E3E9DC 2px 14px)}
.volver-diseno{position:fixed;left:14px;bottom:14px;z-index:99;background:#0D3996;color:#fff;font:600 12px 'Open Sans',sans-serif;padding:8px 14px;border-radius:99px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.volver-diseno:hover{color:#FBB92A}
</style>
</head>
<body>
<div style="width: 390px; min-height: 980px; background: #F5F3EC; font-family: 'Open Sans', system-ui, sans-serif; color: #021135;">
  <div style="background: #FFFFFF; border-bottom: 4px solid #0D3996; box-shadow: 0 3px 0 #FBB92A; position: relative; z-index: 1; padding: 12px 20px; display: flex; align-items: center; gap: 12px;">
    <img src="assets/uned.png" alt="UNED" style="height: 24px;">
    <img src="assets/ecen.png" alt="Escuela de Ciencias Exactas y Naturales" style="height: 32px;">
    <img src="assets/citted.png" alt="CITTED" style="height: 32px;">
  </div>
  <header class="topo-osc" style="padding: 22px 20px 26px; color: #FFFFFF;">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .14em; color: #FBB92A; text-transform: uppercase;">Laboratorio · 3 especímenes</span>
    <h1 style="margin: 6px 0 0; font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif; font-weight: 700; font-size: 34px; line-height: 1;">Reino <span style="font-style: italic;">Fungi</span></h1>
    <p style="margin: 8px 0 0; font-size: 13px; color: #D5DEF2;">Prof. Stephanie Valerio</p>
  </header>

  <div style="padding: 16px 18px 6px; margin-top: -22px;">
    <label style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 14px; padding: 0 14px; height: 50px; box-shadow: 0 8px 20px rgba(2,17,53,.12);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6273" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input type="search" placeholder="Buscar en la selección" aria-label="Buscar en la selección" style="border: 0; outline: 0; font: inherit; font-size: 15px; flex: 1; background: transparent;">
    </label>
    <div style="display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 4px;">
      <button style="flex-shrink: 0; height: 36px; padding: 0 16px; border-radius: 99px; border: 0; background: #0D3996; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600;">Todos</button>
      <button style="flex-shrink: 0; height: 36px; padding: 0 16px; border-radius: 99px; border: 1px solid #D8D2C6; background: #FFFFFF; color: #0D3996; font: inherit; font-size: 13px; font-weight: 600;">Orden A</button>
      <button style="flex-shrink: 0; height: 36px; padding: 0 16px; border-radius: 99px; border: 1px solid #D8D2C6; background: #FFFFFF; color: #0D3996; font: inherit; font-size: 13px; font-weight: 600;">Orden B</button>
      <button style="flex-shrink: 0; height: 36px; padding: 0 16px; border-radius: 99px; border: 1px solid #D8D2C6; background: #FFFFFF; color: #0D3996; font: inherit; font-size: 13px; font-weight: 600;">Madera</button>
      <button style="flex-shrink: 0; height: 36px; padding: 0 16px; border-radius: 99px; border: 1px solid #D8D2C6; background: #FFFFFF; color: #0D3996; font: inherit; font-size: 13px; font-weight: 600;">Suelo</button>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 12px 18px 28px;">
    <a href="qr-profile.html" style="display: block; text-decoration: none; color: inherit; background: #FFFFFF; border-radius: 18px; overflow: hidden;">
      <div class="foto" role="img" aria-label="Foto (marcador)" style="height: 170px; position: relative;">
        <span style="position: absolute; left: 10px; top: 10px; background: #FBB92A; color: #021135; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; padding: 3px 7px; border-radius: 3px; transform: rotate(-3deg);">MHN-2026-001</span>
      </div>
      <div style="padding: 10px 12px 14px;"><strong style="display: block; font-family: 'Merriweather', Georgia, serif; font-style: italic; font-weight: 400; font-size: 17px; color: #143F2C; line-height: 1.1;">Género sp. 1</strong><span style="font-size: 11px; color: #5A6273;">Orden · Familia</span></div>
    </a>
    <a href="qr-profile.html" style="display: block; text-decoration: none; color: inherit; background: #FFFFFF; border-radius: 18px; overflow: hidden; margin-top: 28px;">
      <div class="foto" role="img" aria-label="Foto (marcador)" style="height: 170px; position: relative;">
        <span style="position: absolute; left: 10px; top: 10px; background: #FBB92A; color: #021135; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; padding: 3px 7px; border-radius: 3px; transform: rotate(2deg);">MHN-2026-002</span>
      </div>
      <div style="padding: 10px 12px 14px;"><strong style="display: block; font-family: 'Merriweather', Georgia, serif; font-style: italic; font-weight: 400; font-size: 17px; color: #143F2C; line-height: 1.1;">Género sp. 2</strong><span style="font-size: 11px; color: #5A6273;">Orden · Familia</span></div>
    </a>
    <a href="qr-profile.html" style="display: block; text-decoration: none; color: inherit; background: #FFFFFF; border-radius: 18px; overflow: hidden;">
      <div class="foto" role="img" aria-label="Foto (marcador)" style="height: 170px; position: relative;">
        <span style="position: absolute; left: 10px; top: 10px; background: #FBB92A; color: #021135; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; padding: 3px 7px; border-radius: 3px; transform: rotate(-2deg);">MHN-2026-004</span>
      </div>
      <div style="padding: 10px 12px 14px;"><strong style="display: block; font-family: 'Merriweather', Georgia, serif; font-style: italic; font-weight: 400; font-size: 17px; color: #143F2C; line-height: 1.1;">Género sp. 4</strong><span style="font-size: 11px; color: #5A6273;">Orden · Familia</span></div>
    </a>
  </div>
</div>
<a class="volver-diseno" href="index.html">← Diseño</a>
</body>
</html>
